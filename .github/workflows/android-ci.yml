name: Android CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            'platforms;android-35' 'build-tools;35.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'
      - name: Write test-only Firebase configuration
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          config = {
              'project_info': {'project_number': '1234567890', 'project_id': 'geriatricare-ci'},
              'client': [{
                  'client_info': {
                      'mobilesdk_app_id': '1:1234567890:android:0123456789abcdef',
                      'android_client_info': {'package_name': 'com.geriatricare.app'},
                  },
                  'api_key': [{'current_key': 'CI_DUMMY_KEY_NOT_FOR_PRODUCTION'}],
              }],
              'configuration_version': '1',
          }
          Path('app/google-services.json').write_text(json.dumps(config), encoding='utf-8')
          PY
      - name: Run Android unit tests
        run: gradle --no-daemon testDebugUnitTest
      - name: Build debug APK
        run: gradle --no-daemon assembleDebug
