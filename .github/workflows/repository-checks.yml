name: Repository checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  source-checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Compile repository Python sources
        run: |
          python -m py_compile \
            build_vitaldb_dataset.py \
            compare_project_models.py \
            export_explanation_reference.py \
            train_physionet_ecg_cnn.py \
            train_xgboost_risk_model.py \
            verify_explanations.py \
            verify_xgboost_export.py
      - name: Check repository documentation
        run: |
          test -s README.md
          test -s .gitignore
